<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REDE + SANGUE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header-home">
        <div class="logo-container">
            <a href="index.html" class="logo-link">
                <img src="logo 2.png" alt="Logo Rede + Sangue" class="img-logo">
                <h1>Rede + Sangue</h1>
            </a>
        </div>
        <nav class="nav-home">
            <a href="index.html" class="btn-menu">Home</a>
            <a href="login.html" class="btn-menu ativo">Login</a>
        </nav>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <main class="container-principal">
        <div class="perfil-card card-login">
            <h2>Acessar Painel do Doador</h2>
            <p class="subtitulo-login">Insira seus dados de login</p>
            
            <form id="formulario-login">
                <div class="campo-grupo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required placeholder="ex: joao@email.com">
                </div>
                
                <div class="campo-grupo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required placeholder="Digite qualquer senha">
                </div>
                
                <p id="mensagem-erro" class="erro-autenticacao"></p>
                
                <button type="submit" class="btn-enviar">Entrar</button>
            </form>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 - Rede + Sangue</p>
    </footer>

    <!-- LOGICA DE LOGIN COM USUÁRIOS PRÉ-CADASTRADOS -->
    <script>
        // 1. Banco de dados simulado (E-mail como chave)
        // Como você pediu para validar por usuário e senha, adicionamos o campo 'senha'
        const usuariosCadastros = {
            "joao@email.com": { senha: "123", nome: "João da Silva Santos" },
            "maria@email.com": { senha: "123", nome: "Maria Oliveira Souza" },
            "carlos@email.com": { senha: "123", nome: "Carlos Eduardo Pereira" }
        };

        document.getElementById('formulario-login').addEventListener('submit', function(evento) {
            evento.preventDefault(); // Impede a página de recarregar
            
            const emailDigitado = document.getElementById('email').value.trim();
            const senhaDigitada = document.getElementById('senha').value;
            const mensagemErro = document.getElementById('mensagem-erro');
            
            // 2. Validação das credenciais
            if (usuariosCadastros[emailDigitado]) {
                if (usuariosCadastros[emailDigitado].senha === senhaDigitada) {
                    // Se o e-mail e a senha estiverem corretos, redireciona para a página de perfil
                    // Passamos o e-mail na URL para a página de perfil capturar os dados certos!
                    window.location.href = `perfil.html?email=${encodeURIComponent(emailDigitado)}`;
                } else {
                    mensagemErro.textContent = "Senha incorreta! (Dica: use 123)";
                }
            } else {
                mensagemErro.textContent = "Usuário não encontrado! Tente joao@email.com";
            }
        });
    </script>

</body>
</html>
